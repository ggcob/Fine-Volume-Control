name: Compilar APK MicroVol

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Compilar APK Debug
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Subir APK final para descarga
        uses: actions/upload-artifact@v4
        with:
          name: MicroVol-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
